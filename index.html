<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แบบประเมินความพึงพอใจห้องน้ำสาธารณะ กทม.</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-muted: #6c757d;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: relative;
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 15px;
        }
        .lang-btn {
            background: #e9ecef;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: #495057;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: #198754;
            color: white;
        }

        h2 {
            text-align: center;
            color: #2b3a4a;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.4;
        }

        .section-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #ffffff;
        }

        .section-title {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 10px;
            color: #2b3a4a;
        }

        .criteria-list {
            margin: 0 0 15px 20px;
            padding: 0;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }
        .criteria-list li {
            margin-bottom: 4px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .option-btn {
            border-radius: 10px;
            padding: 14px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Sarabun', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
