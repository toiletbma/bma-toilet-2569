<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินความสะอาดและความปลอดภัยห้องน้ำ กทม.</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #0b5ed7; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #495057; }
        input[type="number"], textarea, select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; font-size: 16px; font-family: 'Sarabun', sans-serif; }
        textarea { resize: vertical; height: 100px; }
        .location-box { background: #e9ecef; padding: 12px 15px; border-radius: 8px; font-weight: 600; color: #495057; margin-bottom: 20px; }
        button { background-color: #0b5ed7; color: white; border: none; padding: 14px; width: 100%; font-size: 18px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0a58ca; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        #loading { display: none; text-align: center; margin-top: 15px; color: #0b5ed7; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 แบบประเมินความสะอาดและความปลอดภัยห้องน้ำ กทม.</h2>
    
    <div class="location-box" id="locationStatus">
        📍 กำลังระบุตำแหน่งสถานที่ของคุณ...
    </div>

    <form id="evaluationForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="healthScore">1. คะแนนความสะอาดห้องน้ำ (Healthy) [เต็ม 10 คะแนน]</label>
            <input type="number" id="healthScore" min="0" max="10" required placeholder="ใส่คะแนน 0 - 10">
        </div>

        <div class="form-group">
            <label for="safetyScore">2. คะแนนความปลอดภัย (Safety) [เต็ม 10 คะแนน]</label>
            <input type="number" id="safetyScore" min="0" max="10" required placeholder="ใส่คะแนน 0 - 10">
        </div>

        <div class="form-group">
            <label for="comment">3. ข้อเสนอแนะเพิ่มเติม</label>
            <textarea id="comment" placeholder="พิมพ์ข้อเสนอแนะ (ถ้ามี)..."></textarea>
        </div>

        <button type="submit" id="submitBtn">🚀 ส่งแบบประเมิน</button>
        <div id="loading">⏳ กำลังบันทึกข้อมูล กรุณารอสักครู่...</div>
    </form>
</div>

<script>
    // URL Web App ใหม่ล่าสุดของคุณหมอ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzaSRL3UP-GRijQ6xllycgGt8qnb3K-A2FzJt3GNfjzbRBngQ7UsuY3sSBMVrchIUTjNw/exec";
    
    let currentLat = 13.7563; // ค่าเริ่มต้น กทม.
    let currentLng = 100.5018;

    // ดึงพิกัด GPS อัตโนมัติเมื่อเปิดเว็บ
    window.onload = function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                currentLat = position.coords.latitude;
                currentLng = position.coords.longitude;
                fetchLocationName(currentLat, currentLng);
            }, function(error) {
                document.getElementById("locationStatus").innerText = "⚠️ ไม่สามารถเข้าถึงตำแหน่ง GPS ได้ (ใช้พิกัดสำรอง)";
            });
        } else {
            document.getElementById("locationStatus").innerText = "⚠️ เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง";
        }
    };

    function fetchLocationName(lat, lng) {
        fetch(`${SCRIPT_URL}?lat=${lat}&lng=${lng}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById("locationStatus").innerText = "📍 สถานที่ใกล้เคียง: " + (data.location || "ไม่พบสถานที่ใกล้เคียง");
            })
            .catch(err => {
                document.getElementById("locationStatus").innerText = "📍 พิกัดปัจจุบัน: " + lat.toFixed(4) + ", " + lng.toFixed(4);
            });
    }

    function submitForm(event) {
        event.preventDefault();
        
        document.getElementById("submitBtn").disabled = true;
        document.getElementById("loading").style.display = "block";

        const formData = {
            lat: currentLat,
            lng: currentLng,
            healthScore: document.getElementById("healthScore").value,
            safetyScore: document.getElementById("safetyScore").value,
            comment: document.getElementById("comment").value
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors", // ป้องกันปัญหา CORS บน GitHub Pages
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(formData)
        })
        .then(() => {
            alert("✅ ส่งแบบประเมินสำเร็จเรียบร้อยแล้วครับ!");
            document.getElementById("evaluationForm").reset();
            document.getElementById("submitBtn").disabled = false;
            document.getElementById("loading").style.display = "none";
            location.reload();
        })
        .catch(error => {
            alert("❌ เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง");
            document.getElementById("submitBtn").disabled = false;
            document.getElementById("loading").style.display = "none";
        });
    }
</script>

</body>
</html>
