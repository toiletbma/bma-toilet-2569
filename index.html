<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แบบประเมินความพึงพอใจห้องน้ำสาธารณะ กทม.</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-muted: #6c757d;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: relative;
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 15px;
        }
        .lang-btn {
            background: #e9ecef;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: #495057;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: #198754;
            color: white;
        }

        h2 {
            text-align: center;
            color: #2b3a4a;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.4;
        }

        .section-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #ffffff;
        }

        .section-title {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 10px;
            color: #2b3a4a;
        }

        .criteria-list {
            margin: 0 0 15px 20px;
            padding: 0;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }
        .criteria-list li {
            margin-bottom: 4px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .option-btn {
            border-radius: 10px;
            padding: 14px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Sarabun', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
        }
        
        .option-btn input { display: none; }

        .option-label {
            display: block;
            font-weight: 700;
            font-size: 15px;
        }

        .btn-happy { background-color: #d1fae5; border-color: #34d399; }
        .btn-happy .option-label { color: #065f46; }

        .btn-neutral { background-color: #fef3c7; border-color: #fbbf24; }
        .btn-neutral .option-label { color: #92400e; }

        .btn-bad { background-color: #fee2e2; border-color: #f87171; }
        .btn-bad .option-label { color: #991b1b; }

        .option-btn.selected {
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.15);
            transform: scale(1.02);
        }
        .btn-happy.selected { border-color: #059669; }
        .btn-neutral.selected { border-color: #d97706; }
        .btn-bad.selected { border-color: #dc2626; }

        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #2b3a4a; 
            font-size: 16px; 
        }
        
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Sarabun', sans-serif;
            resize: vertical;
            height: 90px;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: #198754; outline: none; box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.15); }

        .location-box {
            background-color: #e8f5e9;
            border: 2px solid #81c784;
            color: #1b5e20;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
        }
        .location-box.error {
            background-color: #ffebee;
            border-color: #e57373;
            color: #b71c1c;
        }

        .retry-btn {
            margin-top: 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            font-weight: 600;
            font-size: 14px;
        }

        button[type="submit"] {
            background-color: #198754;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(25, 135, 84, 0.3);
            font-family: 'Sarabun', sans-serif;
        }
        button[type="submit"]:hover { background-color: #157347; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; box-shadow: none; }

        #loading { display: none; text-align: center; margin-top: 15px; color: #198754; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switcher">
        <button type="button" class="lang-btn active" onclick="setLanguage('th')">TH</button>
        <button type="button" class="lang-btn" onclick="setLanguage('en')">EN</button>
        <button type="button" class="lang-btn" onclick="setLanguage('zh')">中文</button>
    </div>

    <h2 data-i18n="title">ประเมินความพึงพอใจห้องน้ำสาธารณะ กทม.</h2>
    
    <form id="evaluationForm" onsubmit="submitForm(event)">
        
        <div class="section-card">
            <div class="section-title" data-i18n="sec1_title">1. ด้านความสะอาด (Healthy)</div>
            <ul class="criteria-list">
                <li data-i18n="sec1_c1">ความสะอาดของห้องน้ำ</li>
                <li data-i18n="sec1_c2">อุปกรณ์ครบและใช้งานได้ดี</li>
                <li data-i18n="sec1_c3">ห้องน้ำไม่มีกลิ่นเหม็น</li>
            </ul>
            <div class="options-grid">
                <label class="option-btn btn-happy" onclick="selectOption(this, 'healthScore', '10')">
                    <span class="option-label" data-i18n="opt_happy">พอใจมาก</span>
                    <input type="radio" name="health" value="10" required>
                </label>
                <label class="option-btn btn-neutral" onclick="selectOption(this, 'healthScore', '5')">
                    <span class="option-label" data-i18n="opt_neutral">ปานกลาง</span>
                    <input type="radio" name="health" value="5">
                </label>
                <label class="option-btn btn-bad" onclick="selectOption(this, 'healthScore', '0')">
                    <span class="option-label" data-i18n="opt_bad">ควรปรับปรุง</span>
                    <input type="radio" name="health" value="0">
                </label>
            </div>
            <input type="hidden" id="healthScore" required>
        </div>

        <div class="section-card">
            <div class="section-title" data-i18n="sec2_title">2. ด้านความปลอดภัย (Safety)</div>
            <ul class="criteria-list">
                <li data-i18n="sec2_c1">มีแสงสว่างเพียงพอ</li>
                <li data-i18n="sec2_c2">พื้นห้องน้ำแห้ง</li>
                <li data-i18n="sec2_c3">รู้สึกปลอดภัยขณะใช้บริการ</li>
            </ul>
            <div class="options-grid">
                <label class="option-btn btn-happy
