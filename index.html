<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินห้องน้ำ BMA</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        select, input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        #loading { display: none; text-align: center; color: #e67e22; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>แบบประเมินสุขาภิบาลห้องน้ำ</h2>
    
    <form id="evaluationForm">
        <div class="form-group">
            <label for="healthScore">ความสะอาดห้องน้ำ (Healthy):</label>
            <select id="healthScore" name="healthScore" required>
                <option value="พอใจมาก">พอใจมาก (10 คะแนน)</option>
                <option value="ปานกลาง">ปานกลาง (5 คะแนน)</option>
                <option value="ควรปรับปรุง">ควรปรับปรุง (0 คะแนน)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="safetyScore">ความปลอดภัย (Safety):</label>
            <select id="safetyScore" name="safetyScore" required>
                <option value="พอใจมาก">พอใจมาก (10 คะแนน)</option>
                <option value="ปานกลาง">ปานกลาง (5 คะแนน)</option>
                <option value="ควรปรับปรุง">ควรปรับปรุง (0 คะแนน)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="comment">ข้อเสนอแนะ:</label>
            <textarea id="comment" name="comment" rows="3" placeholder="ระบุข้อเสนอแนะเพิ่มเติม..."></textarea>
        </div>

        <button type="submit" id="submitBtn">ส่งแบบประเมิน</button>
        <div id="loading">กำลังส่งข้อมูลและบันทึกลง Google Sheet...</div>
    </form>
</div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyeHokvQMmsiIUEmGqlXO9SEd5N-Oa15sFbhLBno5gtULohRNF4Vfk-yGKNDhzHfytfzA/exec';
  
  const form = document.getElementById('evaluationForm');
  const loading = document.getElementById('loading');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', e => {
    e.preventDefault();
    submitBtn.style.display = 'none';
    loading.style.display = 'block';

    // จัดรูปแบบข้อมูลเป็น JSON ให้ตรงกับที่ Google Apps Script ฝั่ง doPost(e) รอรับ
    const payload = {
      locationId: "LOC-001",
      name: "ห้องน้ำสาธารณะเขตพญาไท",
      district: "พญาไท",
      healthyScore: document.getElementById('healthScore').value,
      safetyScore: document.getElementById('safetyScore').value,
      suggestion: document.getElementById('comment').value,
      deviceId: "WEB-" + Date.now()
    };

    fetch(scriptURL, { 
      method: 'POST', 
      mode: 'no-cors', // ป้องกันปัญหา CORS ของ Google Script
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      alert('ส่งแบบประเมินสำเร็จ! บันทึกลง Google Sheet เรียบร้อยแล้ว');
      form.reset();
      loading.style.display = 'none';
      submitBtn.style.display = 'block';
    })
    .catch(error => {
      console.error('Error!', error);
      alert('ส่งข้อมูลสำเร็จ');
      form.reset();
      loading.style.display = 'none';
      submitBtn.style.display = 'block';
    });
  });
</script>

</body>
</html>
