<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินความพึงพอใจห้องน้ำสาธารณะ กทม.</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #006644;
            --primary-hover: #004d33;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #ccd9d3;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        select, input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Sarabun', sans-serif;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 5px rgba(0, 102, 68, 0.2);
        }

        .evaluation-section {
            background: #f9fbfb;
            border: 1px solid #e1e8e5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .evaluation-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 12px;
            border-bottom: 2px solid #e1e8e5;
            padding-bottom: 6px;
        }

        .rating-options {
            display: flex;
            gap: 15px;
        }

        .rating-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            background: #fff;
            transition: all 0.2s ease;
        }

        .rating-btn.selected-green {
            background-color: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .rating-btn.selected-red {
            background-color: #c62828;
            color: white;
            border-color: #c62828;
        }

        .gps-box {
            display: flex;
            gap: 10px;
        }

        .gps-btn {
            background-color: #455a64;
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            font-weight: 600;
            white-space: nowrap;
        }

        .gps-btn:hover {
            background-color: #37474f;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--primary-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>แบบประเมินความพึงพอใจห้องน้ำสาธารณะ</h2>
    <div class="subtitle">กรุงเทพมหานคร (BMA)</div>

    <form id="evaluationForm">
        
        <!-- ข้อมูลสถานที่ (ดึงกลับมาแสดงผลแล้วครับ) -->
        <div class="form-group">
            <label for="locationSelect">เลือกสถานที่ประเมิน:</label>
            <select id="locationSelect" required onchange="updateLocationDetails()">
                <option value="">-- กรุณาเลือกสถานที่ --</option>
                <option value="LOC001|สวนเบญจกิติ|คลองเตย">สวนเบญจกิติ (เขตคลองเตย)</option>
                <option value="LOC002|สถานีขนส่งผู้โดยสารกรุงเทพ (บรมราชชนนี)|ตลิ่งชัน">สถานีขนส่งผู้โดยสารกรุงเทพ (บรมราชชนนี) (เขตตลิ่งชัน)</option>
                <option value="LOC003|ท่าอากาศยานดอนเมือง|ดอนเมือง">ท่าอากาศยานดอนเมือง (เขตดอนเมือง)</option>
                <option value="LOC004|ห้างสรรพสินค้ามิลลี่มอลลี่|คลองเตย">ห้างสรรพสินค้ามิลลี่มอลลี่ (เขตคลองเตย)</option>
                <option value="LOC005|ศูนย์การค้าแพลทฟอร์ม วงเวียนใหญ่|คลองสาน">ศูนย์การค้าแพลทฟอร์ม วงเวียนใหญ่ (เขตคลองสาน)</option>
            </select>
        </div>

        <input type="hidden" id="locationID">
        <input type="hidden" id="locationName">
        <input type="hidden" id="district">

        <!-- ข้อ 1 -->
        <div class="evaluation-section">
            <div class="evaluation-title">1. ความสะอาด (Healthy)</div>
            <label>ประเมินสภาพความสะอาดพื้น ผนัง เพดาน โถส้วม และโถปัสสาวะ:</label>
            <div class="rating-options">
                <div class="rating-btn" onclick="setRating('scoreHealthy', 10, this, 'green')">ผ่าน (10 คะแนน)</div>
                <div class="rating-btn" onclick="setRating('scoreHealthy', 0, this, 'red')">ไม่ผ่าน / สีแดง (0 คะแนน)</div>
            </div>
            <input type="hidden" id="scoreHealthy" required>
        </div>

        <!-- ข้อ 2 -->
        <div class="evaluation-section">
            <div class="evaluation-title">2. ความปลอดภัยและสิ่งอำนวยความสะดวก (Safety)</div>
            <label>ประเมินแสงสว่าง ระบบระบายอากาศ และความปลอดภัย:</label>
            <div class="rating-options">
                <div class="rating-btn" onclick="setRating('scoreSafety', 10, this, 'green')">ผ่าน (10 คะแนน)</div>
                <div class="rating-btn" onclick="setRating('scoreSafety', 0, this, 'red')">ไม่ผ่าน / สีแดง (0 คะแนน)</div>
            </div>
            <input type="hidden" id="scoreSafety" required>
        </div>

        <!-- ข้อเสนอแนะ -->
        <div class="form-group">
            <label for="suggestion">ข้อเสนอแนะเพิ่มเติม:</label>
            <textarea id="suggestion" rows="3" placeholder="ระบุข้อเสนอแนะ หรือข้อควรปรับปรุง..."></textarea>
        </div>

        <!-- พิกัด GPS อยู่ล่างสุดก่อนกดส่ง -->
        <div class="form-group">
            <label for="deviceID">พิกัด GPS (ละติจูด, ลองจิจูด):</label>
            <div class="gps-box">
                <input type="text" id="deviceID" placeholder="กดปุ่มเพื่อดึงพิกัดอัตโนมัติ" readonly required>
                <button type="button" class="gps-btn" onclick="getLocation()">📍 ดึงพิกัด</button>
            </div>
        </div>

        <button type="submit" class="submit-btn">ส่งผลการประเมิน</button>
        <div id="loading">กำลังส่งข้อมูล กรุณารอสักครู่...</div>
    </form>
</div>

<script>
    // URL ของ Web App Google Apps Script ล่าสุด
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxh1Ezns1k26IwpS0lITocmxQkxeNLY3KYw8pfk4Cp5FAGy7BYbZb6aN9mRsoNw9FCvAw/exec';

    function updateLocationDetails() {
        const select = document.getElementById('locationSelect');
        const val = select.value;
        if (val) {
            const parts = val.split('|');
            document.getElementById('locationID').value = parts[0];
            document.getElementById('locationName').value = parts[1];
            document.getElementById('district').value = parts[2];
        } else {
            document.getElementById('locationID').value = '';
            document.getElementById('locationName').value = '';
            document.getElementById('district').value = '';
        }
    }

    function setRating(fieldId, score, element, type) {
        document.getElementById(fieldId).value = score;
        const parent = element.parentElement;
        const buttons = parent.getElementsByClassName('rating-btn');
        for (let btn of buttons) {
            btn.className = 'rating-btn';
        }
        if (type === 'green') {
            element.className = 'rating-btn selected-green';
        } else {
            element.className = 'rating-btn selected-red';
        }
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                document.getElementById('deviceID').value = lat + ", " + lng;
            }, function(error) {
                alert('ไม่สามารถดึงพิกัดได้ กรุณาเปิดใช้งาน GPS');
            });
        } else {
            alert('เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง GPS');
        }
    }

    document.getElementById('evaluationForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const scoreH = document.getElementById('scoreHealthy').value;
        const scoreS = document.getElementById('scoreSafety').value;
        if (scoreH === "" || scoreS === "") {
            alert('กรุณาประเมินคะแนนให้ครบทุกข้อครับ');
            return;
        }

        document.getElementById('loading').style.display = 'block';

        const formData = {
            locationID: document.getElementById('locationID').value,
            locationName: document.getElementById('locationName').value,
            district: document.getElementById('district').value,
            scoreHealthy: scoreH,
            scoreSafety: scoreS,
            suggestion: document.getElementById('suggestion').value,
            deviceID: document.getElementById('deviceID').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(response => {
            document.getElementById('loading').style.display = 'none';
            alert('ส่งผลการประเมินเรียบร้อยแล้ว!');
            document.getElementById('evaluationForm').reset();
            // ล้างสถานะปุ่มเลือกคะแนน
            const buttons = document.getElementsByClassName('rating-btn');
            for(let b of buttons) b.className = 'rating-btn';
        })
        .catch(error => {
            document.getElementById('loading').style.display = 'none';
            alert('เกิดข้อผิดพลาด: ' + error.message);
        });
    });
</script>

</body>
</html>
