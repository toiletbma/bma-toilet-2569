<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินห้องน้ำ BMA</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        select, input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        #loading { display: none; text-align: center; color: #e67e22; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>แบบประเมินสุขาภิบาลห้องน้ำ</h2>
    
    <form id="evaluationForm">
        <!-- พิกัดจะถูกดึงอัตโนมัติ -->
        <input type="hidden" id="lat" name="lat" value="13.7563">
        <input type="hidden" id="lng" name="lng" value="105.0150">

        <div class="form-group">
            <label for="healthScore">คะแนนความสะอาด (Healthy): (สูงสุด 10)</label>
            <select id="healthScore" name="healthScore" required>
                <option value="5">5 คะแนน (ดีเยี่ยม)</option>
                <option value="4">4 คะแนน (ดี)</option>
                <option value="3">3 คะแนน (ปานกลาง)</option>
                <option value="2">2 คะแนน (ควรปรับปรุง)</option>
                <option value="1">1 คะแนน (แย่)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="safetyScore">คะแนนความปลอดภัย (Safety): (สูงสุด 10)</label>
            <select id="safetyScore" name="safetyScore" required>
                <option value="5">5 คะแนน (ดีเยี่ยม)</option>
                <option value="4">4 คะแนน (ดี)</option>
                <option value="3">3 คะแนน (ปานกลาง)</option>
                <option value="2">2 คะแนน (ควรปรับปรุง)</option>
                <option value="1">1 คะแนน (แย่)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="comment">ข้อเสนอแนะ:</label>
            <textarea id="comment" name="comment" rows="3" placeholder="ระบุข้อเสนอแนะเพิ่มเติม..."></textarea>
        </div>

        <button type="submit" id="submitBtn">ส่งแบบประเมิน</button>
        <div id="loading">กำลังส่งข้อมูลและบันทึกลง Google Sheet...</div>
    </form>
</div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyeHokvQMmsiIUEmGqlXO9SEd5N-Oa15sFbhLBno5gtULohRNF4Vfk-yGKNDhzHfytfzA/exec';
  
  const form = document.getElementById('evaluationForm');
  const loading = document.getElementById('loading');
  const submitBtn = document.getElementById('submitBtn');

  // ดึงพิกัด GPS ปัจจุบันของผู้ใช้ (ถ้าเปิดใช้งาน)
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(position => {
      document.getElementById('lat').value = position.coords.latitude;
      document.getElementById('lng').value = position.coords.longitude;
    }, error => {
      console.log('ไม่สามารถดึงพิกัดได้ ใช้ค่าเริ่มต้นแทน');
    });
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    submitBtn.style.display = 'none';
    loading.style.display = 'block';

    fetch(scriptURL, { method: 'POST', body: new FormData(form)})
      .then(response => response.json())
      .then(result => {
        alert('ส่งแบบประเมินสำเร็จ! ระบบบันทึกข้อมูลและคำนวณเกณฑ์สีเรียบร้อยแล้ว');
        form.reset();
        loading.style.display = 'none';
        submitBtn.style.display = 'block';
      })
      .catch(error => {
        console.error('Error!', error.message);
        alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
        loading.style.display = 'none';
        submitBtn.style.display = 'block';
      });
  });
</script>

</body>
</html>
